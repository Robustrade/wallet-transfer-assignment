databaseChangeLog:
  - changeSet:
      id: 001-create-wallets-table
      author: system
      changes:
        - createTable:
            tableName: wallets
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: balance
                  type: BIGINT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-transfers-table
      author: system
      changes:
        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_wallet_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfer_from_wallet
                    references: wallets(id)
              - column:
                  name: to_wallet_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfer_to_wallet
                    references: wallets(id)
              - column:
                  name: amount
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-ledger-entries-table
      author: system
      changes:
        - createTable:
            tableName: ledger_entries
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transfer_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ledger_transfer
                    references: transfers(id)
              - column:
                  name: wallet_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ledger_wallet
                    references: wallets(id)
              - column:
                  name: entry_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: ledger_entries
            indexName: idx_ledger_transfer
            columns:
              - column:
                  name: transfer_id
        - createIndex:
            tableName: ledger_entries
            indexName: idx_ledger_wallet
            columns:
              - column:
                  name: wallet_id

  - changeSet:
      id: 004-create-idempotency-records-table
      author: system
      changes:
        - createTable:
            tableName: idempotency_records
            columns:
              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transfer_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_idempotency_transfer
                    references: transfers(id)
              - column:
                  name: request_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: idempotency_records
            indexName: idx_idempotency_key
            columns:
              - column:
                  name: idempotency_key

  - changeSet:
      id: 005-create-indexes-for-concurrency
      author: system
      changes:
        - createIndex:
            tableName: transfers
            indexName: idx_transfer_from_wallet
            columns:
              - column:
                  name: from_wallet_id
        - createIndex:
            tableName: transfers
            indexName: idx_transfer_to_wallet
            columns:
              - column:
                  name: to_wallet_id
        - createIndex:
            tableName: transfers
            indexName: idx_transfer_status
            columns:
              - column:
                  name: status

