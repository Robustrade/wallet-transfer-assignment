spring:
  application:
    name: wallet-transfer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
