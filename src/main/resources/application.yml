spring:
  application:
    name: wallet-transfer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet_transfer}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, not Hibernate
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        wallet.transfer.latency: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        wallet.transfer.latency: 0.5, 0.95, 0.99

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    com.robustrade.wallet: INFO
    com.robustrade.wallet.handler.WalletHandler: DEBUG
    com.robustrade.wallet.service.WalletServiceImpl: DEBUG
    com.robustrade.wallet.handler.StatementHandler: DEBUG
    com.robustrade.wallet.service.StatementServiceImpl: DEBUG
    com.robustrade.wallet.handler.TransferHandler: DEBUG
    com.robustrade.wallet.service.TransferServiceImpl: DEBUG
    com.robustrade.wallet.service.TransferStatusService: DEBUG
    io.opentelemetry.exporter.logging.LoggingSpanExporter: INFO

