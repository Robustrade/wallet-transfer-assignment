spring:
  application:
    name: wallet-transfer-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.wallettransfer: DEBUG
