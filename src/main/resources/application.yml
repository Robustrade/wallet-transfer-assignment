spring:
  application:
    name: wallet-transfer-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      # Bounds how long a transaction will block on a wallet row lock, so one stuck holder
      # cannot queue every request behind it and exhaust the pool. A timeout (SQLSTATE 55P03)
      # rolls back before anything is written, so retrying with the same key is safe.
      connection-init-sql: SET lock_timeout = '3s'

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

logging:
  level:
    com.robustrade.wallet: ${LOG_LEVEL:INFO}
    # Unknown paths are already reported by the exception handler; don't log them twice.
    org.springframework.web.servlet.resource.NoResourceFoundException: ERROR
