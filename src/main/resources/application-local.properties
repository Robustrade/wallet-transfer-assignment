# Local demo profile — uses H2 in-memory (no PostgreSQL required)
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:wallet_transfer;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=true
# Seed demo wallets on startup
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-local.sql
