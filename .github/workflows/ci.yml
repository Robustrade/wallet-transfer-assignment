name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: [actions_runner_dev_new]
    env:
      LINT_CMD: ${{ vars.LINT_CMD || 'mvn compile' }}
      FORMAT_CHECK_CMD: ${{ vars.FORMAT_CHECK_CMD || 'echo "No format check configured"' }}
      TEST_CMD: ${{ vars.TEST_CMD || 'mvn test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OS
        run: cat /etc/os-release

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate commands configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LINT_CMD:-}" || { echo "Missing repository variable LINT_CMD"; exit 1; }
          test -n "${FORMAT_CHECK_CMD:-}" || { echo "Missing repository variable FORMAT_CHECK_CMD"; exit 1; }
          test -n "${TEST_CMD:-}" || { echo "Missing repository variable TEST_CMD"; exit 1; }

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          eval "$LINT_CMD"

      - name: Run format check
        shell: bash
        run: |
          set -euo pipefail
          eval "$FORMAT_CHECK_CMD"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$TEST_CMD"
