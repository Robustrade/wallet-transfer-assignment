name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: [actions_runner_dev_new]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB:       ${{ vars.POSTGRES_DB }}
        ports:
          - ${{ vars.POSTGRES_PORT }}:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.POSTGRES_USER }} -d ${{ vars.POSTGRES_DB }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL:      ${{ vars.DATABASE_URL }}
      TEST_DATABASE_URL: ${{ vars.TEST_DATABASE_URL }}
      CGO_ENABLED:       ${{ vars.CGO_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OS
        run: cat /etc/os-release

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v1.64.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create test database
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE ${{ vars.POSTGRES_TEST_DB }} OWNER ${{ vars.POSTGRES_USER }};"

      - name: Apply migrations
        run: |
          go run ./cmd/migrate -database "$DATABASE_URL"      -action up
          go run ./cmd/migrate -database "$TEST_DATABASE_URL" -action up

      - name: Run lint
        run: golangci-lint run ./...

      - name: Run format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test -v -race -count=1 ./...
