name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: [actions_runner_dev_new]
    env:
      LINT_CMD: ${{ vars.LINT_CMD }}
      FORMAT_CHECK_CMD: ${{ vars.FORMAT_CHECK_CMD }}
      TEST_CMD: ${{ vars.TEST_CMD }}
      CGO_ENABLED: ${{ vars.CGO_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OS
        run: cat /etc/os-release

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $HOME/.local/bin v1.64.8 echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validate commands configured
        shell: bash
        run: |
          set -euo pipefail
          export LINT_CMD="${LINT_CMD:-golangci-lint run ./...}"
          export FORMAT_CHECK_CMD="${FORMAT_CHECK_CMD:-bash scripts/format-check.sh}"
          export TEST_CMD="${TEST_CMD:-go test ./... -count=1}"
          echo "LINT_CMD=$LINT_CMD" >> "$GITHUB_ENV"
          echo "FORMAT_CHECK_CMD=$FORMAT_CHECK_CMD" >> "$GITHUB_ENV"
          echo "TEST_CMD=$TEST_CMD" >> "$GITHUB_ENV"

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          eval "$LINT_CMD"

      - name: Run format check
        shell: bash
        run: |
          set -euo pipefail
          eval "$FORMAT_CHECK_CMD"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$TEST_CMD"
