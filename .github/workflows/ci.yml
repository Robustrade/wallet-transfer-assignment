name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: [actions_runner_dev_new]
    env:
      LINT_CMD: ${{ vars.LINT_CMD || 'go vet ./...' }}
      FORMAT_CHECK_CMD: ${{ vars.FORMAT_CHECK_CMD || 'test -z "$(gofmt -l cmd internal)"' }}
      TEST_CMD: ${{ vars.TEST_CMD || 'go test ./...' }}
      CGO_ENABLED: ${{ vars.CGO_ENABLED || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OS
        run: cat /etc/os-release

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install golangci-lint
        run: |
          GOBIN="$HOME/.local/bin" go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          eval "$LINT_CMD"

      - name: Run format check
        shell: bash
        run: |
          set -euo pipefail
          eval "$FORMAT_CHECK_CMD"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$TEST_CMD"
