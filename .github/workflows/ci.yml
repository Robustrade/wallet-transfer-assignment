name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: [actions_runner_dev_new]
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OS
        run: cat /etc/os-release

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...

      - name: Run format check
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
