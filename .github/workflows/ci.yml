name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: [actions_runner_dev_new]
    env:
      # Repository variables still win; these defaults keep the workflow
      # self-sufficient so a fresh clone has a working pipeline.
      LINT_CMD: ${{ vars.LINT_CMD || 'golangci-lint run ./...' }}
      FORMAT_CHECK_CMD: ${{ vars.FORMAT_CHECK_CMD || 'test -z "$(gofmt -l .)"' }}
      TEST_CMD: ${{ vars.TEST_CMD || 'go test -race ./...' }}
      # -race needs cgo.
      CGO_ENABLED: ${{ vars.CGO_ENABLED || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OS
        run: cat /etc/os-release

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install golangci-lint
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v1.64.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Integration tests need a real Postgres: mocking the database would let a
      # wrong query pass. Failing here is deliberate — a build that reported
      # success while silently skipping every integration test would be a worse
      # outcome than a red one. The test fixture enforces the same rule
      # independently, refusing to skip when CI is set.
      - name: Start Postgres
        run: docker compose up -d --wait

      - name: Point tests at Postgres
        run: |
          echo 'TEST_DATABASE_URL=postgres://wallet:wallet@localhost:5432/wallet?sslmode=disable' >> "$GITHUB_ENV"

      - name: Validate commands configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LINT_CMD:-}" || { echo "Missing repository variable LINT_CMD"; exit 1; }
          test -n "${FORMAT_CHECK_CMD:-}" || { echo "Missing repository variable FORMAT_CHECK_CMD"; exit 1; }
          test -n "${TEST_CMD:-}" || { echo "Missing repository variable TEST_CMD"; exit 1; }

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          eval "$LINT_CMD"

      - name: Run format check
        shell: bash
        run: |
          set -euo pipefail
          eval "$FORMAT_CHECK_CMD"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$TEST_CMD"

      - name: Stop Postgres
        if: always()
        run: docker compose down -v
