name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: wallet_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LINT_CMD: ${{ vars.LINT_CMD }}
      FORMAT_CHECK_CMD: ${{ vars.FORMAT_CHECK_CMD }}
      TEST_CMD: ${{ vars.TEST_CMD }}
      TEST_DATABASE_URL: "postgres://postgres:postgrespassword@localhost:5432/wallet_test_db?sslmode=disable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8

      - name: Run Format Check
        shell: bash
        run: |
          set -euo pipefail
          CMD="${FORMAT_CHECK_CMD:-test -z \"\$(gofmt -l .)\"}"
          eval "$CMD"

      - name: Run Unit & Integration Tests
        shell: bash
        run: |
          set -euo pipefail
          CMD="${TEST_CMD:-go test -v ./... -race -cover}"
          eval "$CMD"
