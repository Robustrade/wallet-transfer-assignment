name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java-build-test:
    name: java-build-test
    runs-on: [actions_runner_dev_new]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run checkstyle
        run: cd wallet-transfer && ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Run tests
        run: cd wallet-transfer && ./gradlew test --no-daemon

      - name: Build
        run: cd wallet-transfer && ./gradlew build -x test --no-daemon

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: wallet-transfer/build/reports/tests/

  sonarqube:
    name: sonarqube
    runs-on: [actions_runner_dev_new]
    needs: java-build-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: cd wallet-transfer && ./gradlew sonar --no-daemon
        continue-on-error: true
