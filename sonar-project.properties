# SonarQube project settings. Used by the CI sonarqube workflow and by `make sonar-scan`.
sonar.projectKey=wallet-transfer-assignment
sonar.projectName=wallet-transfer-assignment
sonar.sourceEncoding=UTF-8

# Go sources and tests live side by side under internal/.
sonar.sources=cmd,internal,scripts,Dockerfile
sonar.tests=internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/vendor/**,**/node_modules/**,**/coverage/**

# Coverage report written by `make coverage` (go test -coverprofile).
sonar.go.coverage.reportPaths=coverage.out

# Wiring and declarative code is not worth measuring.
sonar.coverage.exclusions=cmd/**,scripts/**,internal/config/**,internal/database/**,internal/bootstrap/**,internal/middleware/**,internal/feature/wallet/model/**,internal/feature/wallet/integration/**

# Table-driven tests repeat structure on purpose.
sonar.cpd.exclusions=**/*_test.go
