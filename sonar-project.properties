# Update these values for your GitHub org and SonarQube project.
sonar.projectKey=wallet-transfer-assignment
sonar.projectName=wallet-transfer-assignment
sonar.sourceEncoding=UTF-8

# Go sources and tests
sonar.sources=.
sonar.exclusions=**/.git/**,**/.github/**,**/vendor/**,**/node_modules/**,**/coverage/**,**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage report (generated by: go test -coverprofile=coverage.out ./...)
sonar.go.coverage.reportPaths=coverage.out

# Language
sonar.language=go
