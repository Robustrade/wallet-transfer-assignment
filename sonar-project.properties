# SonarQube project identification
sonar.projectKey=wallet-transfer-assignment
sonar.projectName=wallet-transfer-assignment
sonar.sourceEncoding=UTF-8

# Java / Maven project layout
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=25

# Coverage (requires `mvn test` to have generated target/site/jacoco/jacoco.xml)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/.git/**,**/.github/**,**/.idea/**,**/target/**,**/vendor/**,**/node_modules/**,**/coverage/**,src/main/resources/db/**
sonar.test.exclusions=**/target/**
sonar.coverage.exclusions=**/*Application.java,src/main/java/com/api/wallet/dto/**,src/main/java/com/api/wallet/domain/**
