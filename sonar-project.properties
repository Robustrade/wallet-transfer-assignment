# Update these values for your GitHub org and SonarQube project.
sonar.projectKey=wallet-transfer-assignment
sonar.projectName=wallet-transfer-assignment
sonar.sourceEncoding=UTF-8

# Go sources live under cmd/ and internal/.
sonar.sources=cmd,internal
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/.git/**,**/.github/**,**/vendor/**,**/node_modules/**,**/coverage/**,**/*_test.go

# Coverage report (generate with: go test ./... -coverprofile=coverage.out).
sonar.go.coverage.reportPaths=coverage.out
