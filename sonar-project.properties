sonar.projectKey=wallet-transfer-assignment
sonar.projectName=wallet-transfer-assignment
sonar.sourceEncoding=UTF-8

# Go source code
sonar.sources=.

# Test files
sonar.tests=.

# Test file patterns
sonar.test.inclusions=**/*_test.go

# Exclude tests and generated/build/dependency files from source analysis
sonar.exclusions=**/*_test.go,**/.git/**,**/.github/**,**/vendor/**,**/node_modules/**,**/coverage/**,**/bin/**

# Go coverage report
sonar.go.coverage.reportPaths=coverage.out