# golangci-lint v1.64.x config (matches CI-pinned version).
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - misspell
    - revive
    - errorlint
    - bodyclose
    - unconvert

linters-settings:
  goimports:
    local-prefixes: github.com/mayankkandpal18/wallet-transfer-assignment
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
