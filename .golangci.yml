# golangci-lint configuration (v1 format, matching the CI-pinned v1.64.8).
# Run:  make lint
run:
  timeout: 5m
  build-tags:
    - integration   # also lint the PostgreSQL integration tests

linters:
  disable-all: true
  enable:
    # defaults
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # extra
    - bodyclose     # unclosed HTTP response bodies (tests)
    - errorlint     # use errors.Is / errors.As and %w
    - gocritic
    - gocyclo       # keeps functions like CreateTransfer from growing back
    - funlen
    - gofmt
    - goimports
    - gosec
    - misspell
    - nilerr
    - noctx         # HTTP requests without context
    - unconvert
    - unparam
    - whitespace

linters-settings:
  goimports:
    local-prefixes: wallet-transfer-assignment
  gocritic:
    enabled-tags: [diagnostic, style]
  gocyclo:
    min-complexity: 15
  funlen:
    lines: 80
    statements: 50
  govet:
    # Default analyzers plus a few extras. Deliberately no `enable-all`: it would
    # turn on fieldalignment, whose --fix reorders struct fields and breaks
    # positional struct literals (for example the table-driven tests).
    enable:
      - nilness
      - unusedwrite

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Tests may use fixed credentials, ignore errors from cleanup, etc.
    - path: _test\.go
      linters: [gosec, errcheck, unparam, funlen, gocyclo]
