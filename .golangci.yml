run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gocritic
    - gosec
    - misspell
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - errorlint
    - gocyclo

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - gocyclo
  max-issues-per-linter: 0
  max-same-issues: 0
