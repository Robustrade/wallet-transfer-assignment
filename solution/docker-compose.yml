services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet_transfer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_transfer"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - wallet_transfer_pg_data:/var/lib/postgresql/data

volumes:
  wallet_transfer_pg_data:
