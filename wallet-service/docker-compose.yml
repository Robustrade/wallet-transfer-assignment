services:
    postgres:
      container_name: wallet-postgres
      image: postgres:17
      environment:
          POSTGRES_USER: wallet_user
          POSTGRES_PASSWORD: wallet_password
          POSTGRES_DB: wallet_db
      ports:
          - "5432:5432"
      volumes:
          - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: 

