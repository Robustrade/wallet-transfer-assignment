# Local Postgres for development and for running the integration tests.
#
#   docker compose up -d
#   export DATABASE_URL='postgres://wallet:wallet@localhost:5432/wallet?sslmode=disable'
#   go run ./cmd/migrate
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 15
