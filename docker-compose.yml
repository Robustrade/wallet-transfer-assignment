# One command: `docker compose up --build`
#   db (healthy) ──▶ migrate (schema + demo seed, exits 0) ──▶ app (healthy on :8080)
name: wallet-transfer

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet}@db:5432/${POSTGRES_DB:-wallet}?sslmode=disable
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-3s}

x-app-build: &app-build
  context: .
  target: runtime

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
    ports:
      # 5433 on the host so it does not clash with a locally installed Postgres.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot job: applies migrations (advisory-locked, idempotent) and demo seed data.
  # Runs before the app so the app never needs DDL rights or races other replicas.
  migrate:
    build: *app-build
    image: wallet-transfer:local
    command: ["migrate", "--seed"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: *app-build
    image: wallet-transfer:local
    command: ["serve"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/wallet", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s

  # ---- test profile: `make test` ---------------------------------------------
  db-test:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Throwaway data on tmpfs; durability settings off for speed (tests only).
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=400"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@db-test:5432/postgres?sslmode=disable
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  pgdata:
