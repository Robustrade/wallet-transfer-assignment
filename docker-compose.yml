services:
  postgres:
    image: postgres:15-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: wallet-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://wallet:${POSTGRES_PASSWORD:-wallet}@postgres:5432/wallet?sslmode=disable"
      LOG_JSON: "true"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"

volumes:
  wallet_pgdata:
