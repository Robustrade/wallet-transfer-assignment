version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: walletdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d walletdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Waiting for DB to be healthy and passing standard connection string
      DATABASE_URL: postgres://user:password@db:5432/walletdb?sslmode=disable
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "./migrate && ./server"
