services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB:       wallet
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
