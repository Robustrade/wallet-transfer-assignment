services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kuku_assignment

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@postgres:5432/wallet?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kuku_assignment

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wallet?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - kuku_assignment

volumes:
  postgres_data:

networks:
  kuku_assignment:
    name: kuku_assignment

