services:
  postgres:
    image: postgres:17-alpine
    container_name: wallet-transfer-postgres
    environment:
      POSTGRES_DB: wallet_transfer
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_dev
    ports:
      - "5432:5432"
    volumes:
      - wallet-transfer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_transfer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wallet-transfer-postgres-data:
