version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet_transfer_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/wallet_db?sslmode=disable"
      LOG_LEVEL: "info"
      ENVIRONMENT: "production"
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
