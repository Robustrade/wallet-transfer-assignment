services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-transfer-postgres
    restart: unless-stopped
    # WALLET_DB_HOST_PORT defaults to 5433 to avoid conflict with local PostgreSQL on 5432.
    ports:
      - "${WALLET_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_DB: ${POSTGRES_DB:-wallet_transfer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet_transfer}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
