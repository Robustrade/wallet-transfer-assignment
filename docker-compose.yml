services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallets
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallets"]
      interval: 2s
      timeout: 5s
      retries: 10
