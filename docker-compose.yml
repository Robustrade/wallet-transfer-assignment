services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-transfer-postgres
    environment:
      POSTGRES_DB: wallet_transfer
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_transfer"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - wallet-transfer-data:/var/lib/postgresql/data

volumes:
  wallet-transfer-data:
