# Postgres 16 for local development and tests.
# Host port 5433 avoids a Postgres already listening on 5432.
# App:  postgres://wallet:wallet@localhost:5433/wallet?sslmode=disable
# Test: postgres://wallet:wallet@localhost:5433/wallet_test?sslmode=disable
name: wallet-transfer

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first volume init; creates wallet_test for go test TRUNCATE.
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
