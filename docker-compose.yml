services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet_transfer_pg
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_transfer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_transfer"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
