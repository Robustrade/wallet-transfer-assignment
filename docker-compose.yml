services:
  postgres:
    image: postgres:16
    container_name: wallet-transfer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet_transfer_test
    ports:
      - "5432:5432"
    volumes:
      - wallet_transfer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_transfer_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wallet_transfer_pgdata: