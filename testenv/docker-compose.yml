services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet_pg
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    # Scripts in /docker-entrypoint-initdb.d/ are executed by the Postgres image
    # (in filename order) the first time the data directory is initialized. This
    # applies the authoritative schema as part of database provisioning, so the
    # service never creates its own tables. In production the same schema.sql is
    # applied by your DB provisioning/migration step; this mirrors it locally.
    volumes:
      - ../migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30
